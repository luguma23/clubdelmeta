<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Socios</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- NAV -->
    <header class="top-nav">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Volver al Panel
        </a>

        <nav class="nav-tabs">
            <a class="tab" href="reservas.html"><i class="fas fa-calendar"></i> Reservas</a>
            <a class="tab active" href="miembros.html"><i class="fas fa-users"></i> Socios</a>
            <a class="tab" href="informes.html"><i class="fas fa-chart-bar"></i> Reportes</a>
        </nav>

        <div class="user-info-nav">
            Administrador General
            <button class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>
    </header>

    <!-- CONTENIDO -->
    <main class="main-container">

        <!-- TÍTULO -->
        <section class="title-card">
            <h1 class="main-title">Gestión de Socios</h1>
            <p class="subtitle">Registrar y administrar socios</p>
        </section>

        <!-- FORMULARIO -->
        <section class="white-card">
            <h2 class="section-title">Registrar Socio</h2>

            <form id="member-form">

                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre completo</label>
                        <input type="text" id="member-name" required>
                    </div>

                    <div class="form-group">
                        <label>Correo</label>
                        <input type="email" id="member-email" required>
                    </div>

                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="member-phone" required>
                    </div>
                </div>

                <button class="btn-primary" type="submit">
                    <i class="fas fa-user-plus"></i> Registrar Socio
                </button>

            </form>
        </section>

        <!-- TABLA -->
        <section class="white-card">
            <h2 class="section-title">
                Socios Registrados — Total: <span id="total-members">0</span>
            </h2>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Código Descuento</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="members-list">
                    <!-- Aquí se cargan los socios -->
                </tbody>

            </table>
        </section>

    </main>

    <!-- Scripts necesarios -->
    <script src="main.js"></script>
    <script src="miembros.js"></script>

</body>
</html>
