<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Socios</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <h1>Gestión de Socios</h1>
        <nav><a href="admin.html">Volver</a></nav>
    </header>
    <main>
        <form id="member-form">
            <label>Nombre: <input type="text" id="member-name" required></label>
            <label>Correo: <input type="email" id="member-email" required></label>
            <label>Teléfono: <input type="tel" id="member-phone" required></label>
            <button type="submit">Registrar Socio</button>
        </form>
        <form id="prospect-form">
            <label>Nombre: <input type="text" id="prospect-name" required></label>
            <label>Correo: <input type="email" id="prospect-email" required></label>
            <label>Teléfono: <input type="tel" id="prospect-phone" required></label>
            <button type="submit">Postular Socio</button>
        </form>
        <ul id="members-list"></ul>
        <ul id="prospects-list"></ul>
    </main>
    <script src="main.js"></script>
    <script src="members.js"></script>
</body>
</html>
